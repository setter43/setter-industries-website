<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Setter Industries - TIS Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1623;--navy-mid:#111f30;--navy-panel:#172540;--navy-card:#1d2e4a;
  --blue:#2361c3;--blue-hi:#3a78e0;
  --gold:#c8a44a;--gold-hi:#e0bb6a;
  --verified:#22c55e;--analyzing:#f59e0b;--danger:#ef4444;
  --text:#dde4f0;--text-dim:#556a8a;--border:rgba(35,97,195,0.22);
}
html,body{min-height:100%;overflow:hidden;background:var(--navy);font-family:'Barlow Condensed',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}

/* PAGE */
.page{max-width:100%;margin:0;padding:0;overflow:hidden}

/* HERO */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero-logo{width:52px;height:52px;flex-shrink:0}
.hero-logo img{width:100%;height:100%;object-fit:contain}
.hero-name{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.hero-tagline{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:'Share Tech Mono',monospace;margin-top:4px}
.page-title{font-size:clamp(36px,5vw,58px);font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1;margin-bottom:14px}
.page-title span{color:var(--gold)}
.page-sub{font-size:17px;color:var(--text-dim);max-width:560px;line-height:1.5;margin-bottom:40px;letter-spacing:.02em}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:44px}
.tag{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:3px;border:1px solid var(--border);color:var(--text-dim);background:var(--navy-mid)}
.tag.blue{border-color:var(--blue);color:var(--blue-hi);background:rgba(35,97,195,.12)}
.tag.gold{border-color:var(--gold);color:var(--gold-hi);background:rgba(200,164,74,.1)}

/* DEMO WRAP */
.demo-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--navy-mid);margin-bottom:0}
.demo-chrome{background:var(--navy-panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
.chrome-dots{display:flex;gap:6px}
.chrome-dot{width:10px;height:10px;border-radius:50%;background:var(--navy-card)}
.chrome-title{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase;flex:1;text-align:center}
.chrome-badge{font-family:'Share Tech Mono',monospace;font-size:9px;padding:2px 8px;border-radius:3px;background:rgba(34,197,94,.12);color:var(--verified);border:1px solid rgba(34,197,94,.25);letter-spacing:.1em}

/* DEMO INNER GRID */
.demo-inner{display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr 64px;height:500px}

/* SIDEBAR */
.demo-sidebar{grid-row:1/3;background:var(--navy-panel);border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.demo-sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-hi),var(--gold))}
.dsb-brand{display:flex;align-items:center;gap:9px;margin-bottom:14px;margin-top:6px}
.dsb-logo{width:34px;height:34px;flex-shrink:0}
.dsb-logo img{width:100%;height:100%;object-fit:contain}
.dsb-name{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text);line-height:1.1}
.dsb-tag{font-size:8px;letter-spacing:.14em;color:var(--gold);font-family:'Share Tech Mono',monospace;text-transform:uppercase;margin-top:3px}
.dsb-divider{height:1px;background:var(--border);margin:10px 0}
.dsb-section{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px}
.dsb-input-box{background:var(--navy-card);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--verified);animation:pulse 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* BARS */
.bars-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--navy-card) transparent}
.bars-scroll::-webkit-scrollbar{width:3px}
.bars-scroll::-webkit-scrollbar-track{background:transparent}
.bars-scroll::-webkit-scrollbar-thumb{background:var(--navy-card)}
.bar-row{margin-bottom:9px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.bar-label{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bar-pct{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);flex-shrink:0;margin-left:4px;transition:color .2s}
.bar-pct.top{color:var(--gold)}
.bar-track{height:4px;background:var(--navy-card);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;background:var(--blue);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.top{background:var(--gold)}
.dsb-config{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--text-dim);letter-spacing:.06em;margin-top:8px;flex-shrink:0}

/* FEED */
.demo-feed{position:relative;background:#060e18;overflow:hidden;display:flex;align-items:center;justify-content:center}
.feed-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.feed-img.active{opacity:1}
.feed-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,14,24,.15) 0%,rgba(6,14,24,.08) 60%,rgba(6,14,24,.55) 100%);pointer-events:none}

/* Corner brackets */
.corner-br{position:absolute;width:22px;height:22px;border-color:rgba(200,164,74,.55);border-style:solid}
.corner-br.tl{top:10px;left:10px;border-width:2px 0 0 2px}
.corner-br.tr{top:10px;right:10px;border-width:2px 2px 0 0}
.corner-br.bl{bottom:10px;left:10px;border-width:0 0 2px 2px}
.corner-br.br{bottom:10px;right:10px;border-width:0 2px 2px 0}

/* Target lock box */
.target-box{position:absolute;border:2px solid var(--gold);border-radius:2px;opacity:0;transition:opacity .4s,left .5s,top .5s,width .5s,height .5s}
.target-box.visible{opacity:1}
.target-tag{position:absolute;top:-22px;left:-2px;background:var(--gold);color:#0b1623;font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;letter-spacing:.08em;white-space:nowrap;opacity:0;transition:opacity .3s}
.target-box.visible .target-tag{opacity:1}

/* Scan line */
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(58,120,224,.45),transparent);animation:scanline 2.8s linear infinite}
@keyframes scanline{0%{top:5%}100%{top:95%}}

/* ALERT PANEL */
.demo-alert{position:absolute;top:12px;right:12px;width:220px;background:var(--navy-mid);border:2px solid var(--gold);border-radius:7px;overflow:hidden;opacity:0;transform:translateX(16px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:10}
.demo-alert.visible{opacity:1;transform:translateX(0);pointer-events:all}
.alert-bar{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.alert-body{padding:12px 14px 14px}
.alert-ey{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--gold);margin-bottom:8px}
.alert-hr{height:1px;background:var(--border);margin:6px 0 10px}
.alert-sub{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--text-dim);margin-bottom:2px}
.alert-tgt{font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text);line-height:1.1}
.alert-conf{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--blue-hi);margin-top:3px;margin-bottom:12px}
.alert-op{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--text-dim);margin-bottom:6px}
.alert-btns{display:flex;gap:6px}
.alert-btn{flex:1;padding:7px 0;border:none;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.08em;font-weight:600;cursor:pointer;text-transform:uppercase;transition:filter .15s}
.alert-btn.c{background:var(--verified);color:#fff}
.alert-btn.d{background:var(--danger);color:#fff}
.alert-btn:hover{filter:brightness(1.12)}

/* STATUS BAR */
.demo-status{background:var(--navy-panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:20px;position:relative;overflow:hidden}
.demo-status::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.status-txt{font-family:'Share Tech Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text);flex:1;transition:color .3s}
.strike-wrap{display:flex;gap:6px}
.sdot{font-size:18px;color:var(--navy-card);transition:color .2s,transform .2s}
.sdot.lit{color:var(--analyzing);transform:scale(1.2)}
.sdot.vfy{color:var(--verified);transform:scale(1.2)}

/* FEATURE GRID */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:52px}
.feat-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:8px;padding:22px 20px;position:relative;overflow:hidden}
.feat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue)}
.feat-card.gold::before{background:var(--gold)}
.feat-icon{font-size:20px;margin-bottom:10px;display:block}
.feat-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--text)}
.feat-desc{font-size:13px;color:var(--text-dim);line-height:1.5;letter-spacing:.02em}

/* CTA */
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta-btn{padding:12px 28px;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;border:none;transition:filter .15s;text-decoration:none;display:inline-block}
.cta-btn.primary{background:var(--gold);color:var(--navy)}
.cta-btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.cta-btn:hover{filter:brightness(1.1)}
.cta-note{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.08em}

/* FOOTER */
.page-footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-brand{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.footer-tag{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim)}

@media(max-width:680px){
  .demo-inner{grid-template-columns:1fr;grid-template-rows:180px 1fr 56px;height:auto}
  .demo-sidebar{grid-row:auto;border-right:none;border-bottom:1px solid var(--border);max-height:180px}
  .demo-feed{min-height:220px}
  .demo-alert{width:calc(100% - 24px)}
}

html,body{overflow:hidden!important;}
body::-webkit-scrollbar{display:none!important;}
</style>
</head>

        <!-- Alert -->
        <div class="demo-alert" id="demo-alert">
          <div class="alert-bar"></div>
          <div class="alert-body">
            <div class="alert-ey">⚠ &nbsp;TARGET VERIFIED</div>
            <div class="alert-hr"></div>
            <div class="alert-sub">Classification</div>
            <div class="alert-tgt" id="alert-tgt">CHALLENGER 2</div>
            <div class="alert-conf" id="alert-conf">CONFIDENCE 92%</div>
            <div class="alert-op">Operator action required</div>
            <div class="alert-btns">
              <button class="alert-btn c" id="btn-confirm">✔ Confirm</button>
              <button class="alert-btn d" id="btn-decline">✖ Decline</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div class="demo-status">
        <div class="status-txt" id="status-txt">SCANNING // UNIDENTIFIED</div>
        <div class="strike-wrap">
          <div class="sdot" id="sd0">◆</div><div class="sdot" id="sd1">◆</div><div class="sdot" id="sd2">◆</div>
        </div>
      </div>
    </div>
  </div>
  </div>

</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
// MIN_BAR_PCT: only labels at or above this % are shown in the sidebar.
// This keeps the bar list clean when there are many labels.
const MIN_BAR_PCT = 30;

// All possible labels in the model
const ALL_LABELS = ['Challenger 2', 'T-90', 'F-35', 'MiG-25'];

// Scene definitions - each maps to a real feed image and scripted confidence arc
const SCENES = [
  {
    label: 'Challenger 2', imgId: 'img-challenger',
    peak: 0.91,
    others: [{ label:'T-90', score:0.05 }, { label:'F-35', score:0.02 }, { label:'MiG-25', score:0.02 }],
    box: { left:'22%', top:'18%', width:'54%', height:'62%' }
  },
  {
    label: 'F-35', imgId: 'img-f35',
    peak: 0.88,
    others: [{ label:'MiG-25', score:0.07 }, { label:'T-90', score:0.03 }, { label:'Challenger 2', score:0.02 }],
    box: { left:'20%', top:'15%', width:'58%', height:'66%' }
  },
  {
    label: 'T-90', imgId: 'img-t90',
    peak: 0.94,
    others: [{ label:'Challenger 2', score:0.04 }, { label:'F-35', score:0.01 }, { label:'MiG-25', score:0.01 }],
    box: { left:'14%', top:'20%', width:'68%', height:'58%' }
  },
  {
    label: 'MiG-25', imgId: 'img-mig',
    peak: 0.86,
    others: [{ label:'F-35', score:0.09 }, { label:'T-90', score:0.03 }, { label:'Challenger 2', score:0.02 }],
    box: { left:'18%', top:'14%', width:'62%', height:'70%' }
  },
];

// ── STATE ────────────────────────────────────────────────────
let sceneIdx   = 0;
let alertShown = false;
let strikeCount= 0;
let sceneTimer = null;

// ── BARS ─────────────────────────────────────────────────────
// Only renders labels where score >= MIN_BAR_PCT/100.
// Labels that fall below threshold are removed from the DOM cleanly.
function renderBars(topLabel, topScore, allScores) {
  const container = document.getElementById('bars-container');

  // Build a map of all current scores
  const scoreMap = {};
  scoreMap[topLabel] = topScore;
  allScores.forEach(({label, score}) => { scoreMap[label] = score; });
  ALL_LABELS.forEach(l => { if (scoreMap[l] === undefined) scoreMap[l] = 0; });

  // Determine which labels to show (>= threshold)
  const threshold = MIN_BAR_PCT / 100;
  const visible   = ALL_LABELS.filter(l => scoreMap[l] >= threshold)
                              .sort((a,b) => scoreMap[b] - scoreMap[a]);

  // Remove bars for labels that dropped below threshold
  container.querySelectorAll('.bar-row').forEach(el => {
    if (!visible.includes(el.dataset.label)) el.remove();
  });

  // Add or update bars for visible labels
  visible.forEach(label => {
    const score = scoreMap[label];
    const pct   = Math.round(score * 100);
    const isTop = label === topLabel;

    let row = container.querySelector(`[data-label="${CSS.escape(label)}"]`);
    if (!row) {
      // Create new bar row
      row = document.createElement('div');
      row.className   = 'bar-row';
      row.dataset.label = label;
      row.innerHTML = `
        <div class="bar-header">
          <span class="bar-label">${label.toUpperCase()}</span>
          <span class="bar-pct${isTop?' top':''}">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill${isTop?' top':''}" style="width:0%"></div></div>`;
      container.appendChild(row);
      // Slight delay so the animation plays on entry
      requestAnimationFrame(() => {
        row.querySelector('.bar-fill').style.width = pct+'%';
        row.querySelector('.bar-pct').textContent  = pct+'%';
      });
    } else {
      // Update existing
      const fill = row.querySelector('.bar-fill');
      const ptxt = row.querySelector('.bar-pct');
      fill.style.width = pct+'%';
      fill.className   = 'bar-fill'+(isTop?' top':'');
      ptxt.textContent = pct+'%';
      ptxt.className   = 'bar-pct'+(isTop?' top':'');
    }
  });
}

function clearBars() {
  document.getElementById('bars-container').innerHTML = '';
}

// ── UI HELPERS ────────────────────────────────────────────────
function setStatus(txt, color) {
  const el = document.getElementById('status-txt');
  el.textContent = txt;
  el.style.color = color || 'var(--text)';
}

function setDots(n, state) {
  ['sd0','sd1','sd2'].forEach((id, i) => {
    const d = document.getElementById(id);
    d.className = 'sdot' + (state==='vfy' ? ' vfy' : (state==='lit' && i<n ? ' lit' : ''));
  });
}

function showFeedImage(imgId) {
  document.querySelectorAll('.feed-img').forEach(img => img.classList.remove('active'));
  document.getElementById(imgId)?.classList.add('active');
}

function showTargetBox(box) {
  const el = document.getElementById('target-box');
  Object.assign(el.style, box);
  el.classList.add('visible');
}

function hideTargetBox() {
  document.getElementById('target-box').classList.remove('visible');
}

function setTargetTag(label) {
  document.getElementById('target-tag').textContent = label.toUpperCase();
}

function showAlert(label, score) {
  document.getElementById('alert-tgt').textContent  = label.toUpperCase();
  document.getElementById('alert-conf').textContent = 'CONFIDENCE  '+Math.round(score*100)+'%';
  document.getElementById('demo-alert').classList.add('visible');
}

function hideAlert() {
  document.getElementById('demo-alert').classList.remove('visible');
}

// ── SCENE RUNNER ─────────────────────────────────────────────
function resetScene() {
  clearTimeout(sceneTimer);
  strikeCount = 0;
  alertShown  = false;
  hideAlert();
  hideTargetBox();
  clearBars();
  setStatus('SCANNING  //  UNIDENTIFIED', 'var(--text)');
  setDots(0, 'off');
}

function runScene() {
  const scene = SCENES[sceneIdx];

  // Phase timings (ms from scene start)
  const PHASES = [
    // Phase 0 - early scan, low confidence, no bars shown yet (all below 30%)
    { delay: 0, fn: () => {
      showFeedImage(scene.imgId);
      renderBars(scene.label, 0.12, scene.others.map(o => ({label:o.label, score:o.score*0.4})));
      setStatus('SCANNING  //  UNIDENTIFIED', 'var(--text)');
      setDots(0, 'off');
    }},
    // Phase 1 - rising, top label crosses threshold, bar appears
    { delay: 1300, fn: () => {
      renderBars(scene.label, 0.42, scene.others.map(o => ({label:o.label, score:o.score*0.7})));
      setStatus('ANALYZING  //  '+scene.label.toUpperCase(), 'var(--analyzing)');
      setTargetTag(scene.label);
      showTargetBox(scene.box);
      strikeCount = 1;
      setDots(1, 'lit');
    }},
    // Phase 2 - second strike
    { delay: 2700, fn: () => {
      renderBars(scene.label, 0.65, scene.others);
      strikeCount = 2;
      setDots(2, 'lit');
    }},
    // Phase 3 - third strike, VERIFIED
    { delay: 4100, fn: () => {
      renderBars(scene.label, scene.peak, scene.others);
      strikeCount = 3;
      setStatus('VERIFIED  //  '+scene.label.toUpperCase(), 'var(--verified)');
      setDots(3, 'vfy');
      if (!alertShown) {
        alertShown = true;
        showAlert(scene.label, scene.peak);
      }
    }},
    // Phase 4 - auto-advance if operator doesn't interact
    { delay: 9500, fn: () => {
      if (!alertShown) return;
      hideAlert();
      sceneIdx = (sceneIdx + 1) % SCENES.length;
      resetScene();
      sceneTimer = setTimeout(runScene, 800);
    }},
  ];

  PHASES.forEach(({ delay, fn }) => {
    sceneTimer = setTimeout(fn, delay);
  });
}

// ── ALERT BUTTONS ────────────────────────────────────────────
document.getElementById('btn-confirm').addEventListener('click', () => {
  const tgt = document.getElementById('alert-tgt').textContent;
  hideAlert();
  setStatus('CONFIRMED  //  '+tgt, 'var(--verified)');
  setDots(3, 'vfy');
  setTimeout(() => {
    sceneIdx = (sceneIdx + 1) % SCENES.length;
    resetScene();
    setTimeout(runScene, 600);
  }, 2000);
});

document.getElementById('btn-decline').addEventListener('click', () => {
  hideAlert();
  hideTargetBox();
  setStatus('SCANNING  //  UNIDENTIFIED', 'var(--text)');
  setDots(0, 'off');
  setTimeout(() => {
    sceneIdx = (sceneIdx + 1) % SCENES.length;
    resetScene();
    setTimeout(runScene, 600);
  }, 1000);
});

// ── BOOT ─────────────────────────────────────────────────────
setTimeout(runScene, 500);
</script>
</body>
</html>
